<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoopSense Panel</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --sub: #555555;
    --line: #111111;
    --line-soft: #cccccc;
    --rstk: #b3261e;
    --low: #a15c00;
    --ok: #1e7a34;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    padding: 24px 16px 60px;
    font-size: 14px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0;
  }
  .conn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .dot {
    width: 8px; height: 8px;
    border: 1px solid var(--line);
    background: var(--sub);
  }
  .dot.online { background: var(--ok); }
  .dot.offline { background: var(--rstk); }

  .section-label {
    font-size: 12px;
    color: var(--sub);
    margin: 0 0 6px 2px;
  }

  .box {
    border: 1px solid var(--line);
    padding: 14px;
    margin-bottom: 18px;
  }

  .ip-row {
    display: flex;
    gap: 8px;
  }
  .ip-row input {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
    border: 1px solid var(--line);
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
  }
  .ip-row input:focus { outline: 2px solid var(--text); outline-offset: -1px; }
  .ip-row button {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--line);
    background: var(--text);
    color: var(--bg);
    padding: 8px 16px;
    cursor: pointer;
  }
  .ip-row button:hover { background: #333; }
  .ip-row button:active { background: #000; }

  table.info {
    width: 100%;
    border-collapse: collapse;
  }
  table.info tr {
    border-bottom: 1px solid var(--line-soft);
  }
  table.info tr:last-child { border-bottom: none; }
  table.info td {
    padding: 9px 4px;
    vertical-align: middle;
  }
  table.info td.k {
    color: var(--sub);
    width: 44%;
    white-space: nowrap;
  }
  table.info td.v {
    text-align: right;
    font-weight: 600;
  }
  table.info td.v .unit {
    font-weight: 400;
    color: var(--sub);
    margin-left: 3px;
  }

  .nickname-input {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    border: 1px solid transparent;
    background: none;
    color: var(--text);
    text-align: right;
    padding: 2px 4px;
    width: 60%;
  }
  .nickname-input:focus {
    outline: none;
    border: 1px solid var(--line);
    background: #f5f5f5;
  }

  .status-chip {
    display: inline-block;
    padding: 2px 10px;
    border: 1px solid var(--line);
    font-weight: 700;
    font-size: 13px;
  }
  .status-chip.RSTK { background: var(--rstk); color: #fff; }
  .status-chip.LOW  { background: var(--low); color: #fff; }
  .status-chip.OK   { background: var(--ok); color: #fff; }
  .status-chip.UNKNOWN { background: #eee; color: var(--sub); border-color: var(--line-soft); }

  .offline-note {
    font-size: 12px;
    color: var(--sub);
    text-align: left;
    border-left: 3px solid var(--rstk);
    padding: 6px 10px;
    margin-top: -6px;
    margin-bottom: 18px;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>CoopSense Panel</h1>
    <div class="conn">
      <span class="dot" id="connDot"></span>
      <span id="connLabel">connecting</span>
    </div>
  </header>

  <div class="section-label">tray address</div>
  <div class="box ip-row">
    <input id="deviceIp" type="text" placeholder="192.168.1.42" value="">
    <button onclick="saveIp()">Connect</button>
  </div>

  <div class="offline-note" id="offlineNote">
    Can't reach this tray right now. Values below are the last confirmed reading.
  </div>

  <div class="section-label">tray info</div>
  <div class="box">
    <table class="info">
      <tr>
        <td class="k">Name</td>
        <td class="v"><input class="nickname-input" id="nicknameInput" value="Unnamed Tray" spellcheck="false"></td>
      </tr>
      <tr>
        <td class="k">MAC / Local IP</td>
        <td class="v" id="macIp">— / —</td>
      </tr>
      <tr>
        <td class="k">Total Weight</td>
        <td class="v" id="totalWeight">—<span class="unit">g</span></td>
      </tr>
      <tr>
        <td class="k">Quantity</td>
        <td class="v" id="quantity">—<span class="unit">items</span></td>
      </tr>
      <tr>
        <td class="k">Unit Weight</td>
        <td class="v" id="unitWeight">—<span class="unit">g</span></td>
      </tr>
      <tr>
        <td class="k">Up Time</td>
        <td class="v" id="uptime">—</td>
      </tr>
      <tr>
        <td class="k">Status</td>
        <td class="v"><span class="status-chip UNKNOWN" id="statusBadge">—</span></td>
      </tr>
      <tr>
        <td class="k">Silence</td>
        <td class="v" id="silenceState">—</td>
      </tr>
      <tr>
        <td class="k">Last Seen</td>
        <td class="v" id="lastSeen">never</td>
      </tr>
    </table>
  </div>

</div>

<script>
let currentIp = localStorage.getItem('coopsense_ip') || '';
let pollTimer = null;
let lastGoodData = null;
let lastSeenTimestamp = null; // only ever set on a SUCCESSFUL poll — this is the bug fix
let nicknameDirty = false;

document.getElementById('deviceIp').value = currentIp;

function saveIp() {
  currentIp = document.getElementById('deviceIp').value.trim();
  localStorage.setItem('coopsense_ip', currentIp);
  restartPolling();
}

function setConn(online) {
  const dot = document.getElementById('connDot');
  const label = document.getElementById('connLabel');
  const note = document.getElementById('offlineNote');
  dot.className = 'dot ' + (online ? 'online' : 'offline');
  label.textContent = online ? 'online' : 'offline';
  note.style.display = online ? 'none' : 'block';
}

function formatLastSeen() {
  const el = document.getElementById('lastSeen');
  if (!lastSeenTimestamp) {
    el.textContent = 'never';
    return;
  }
  const secondsAgo = Math.floor((Date.now() - lastSeenTimestamp) / 1000);
  if (secondsAgo < 5) {
    el.textContent = 'just now';
  } else if (secondsAgo < 60) {
    el.textContent = secondsAgo + 's ago';
  } else {
    el.textContent = new Date(lastSeenTimestamp).toLocaleTimeString();
  }
}

function render(data) {
  document.getElementById('macIp').textContent = (data.mac || '—') + ' / ' + (data.ip || currentIp || '—');

  if (!nicknameDirty) {
    document.getElementById('nicknameInput').value = data.nickname || 'Unnamed Tray';
  }

  const badge = document.getElementById('statusBadge');
  badge.textContent = data.status || 'UNKNOWN';
  badge.className = 'status-chip ' + (data.status || 'UNKNOWN');

  document.getElementById('totalWeight').innerHTML =
    (typeof data.totalWeight === 'number' ? data.totalWeight.toFixed(1) : '—') + '<span class="unit">g</span>';

  document.getElementById('unitWeight').innerHTML =
    (data.hasItemWeight ? data.unitWeight.toFixed(1) : '—') + '<span class="unit">g</span>';

  document.getElementById('quantity').innerHTML =
    (data.hasItemWeight ? data.quantity.toFixed(0) : '—') + '<span class="unit">items</span>';

  const upSec = Math.floor((data.uptimeMs || 0) / 1000);
  const h = Math.floor(upSec / 3600);
  const m = Math.floor((upSec % 3600) / 60);
  document.getElementById('uptime').textContent = h + 'h ' + m + 'm';

  document.getElementById('silenceState').textContent = data.silenceState === 'MUTED' ? 'Muted' : 'Unmuted';

  // NOTE: lastSeenTimestamp is intentionally NOT touched here.
  // render() just displays whatever the current value is — see formatLastSeen().
  formatLastSeen();
}

async function poll() {
  if (!currentIp) {
    setConn(false);
    return;
  }
  try {
    const res = await fetch('http://' + currentIp + '/status', { signal: AbortSignal.timeout(3000) });
    if (!res.ok) throw new Error('bad status');
    const data = await res.json();
    lastGoodData = data;
    lastSeenTimestamp = Date.now(); // ONLY updated here, on a confirmed successful response
    setConn(true);
    render(data);
  } catch (e) {
    setConn(false);
    if (lastGoodData) render(lastGoodData); // shows cached values, but lastSeenTimestamp stays frozen at its real value
  }
}

async function pushNickname(value) {
  if (!currentIp || !value) return;
  try {
    await fetch('http://' + currentIp + '/nickname', {
      method: 'POST',
      body: value,
      signal: AbortSignal.timeout(3000)
    });
  } catch (e) {
    // silently retried on next poll cycle regardless
  }
  nicknameDirty = false;
}

document.getElementById('nicknameInput').addEventListener('input', () => {
  nicknameDirty = true;
});
document.getElementById('nicknameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.target.blur();
    pushNickname(e.target.value.trim());
  }
});

function restartPolling() {
  if (pollTimer) clearInterval(pollTimer);
  poll();
  pollTimer = setInterval(poll, 2000);
}

// Keep the "Last Seen" text ticking (e.g. "12s ago") even between polls,
// without ever touching lastSeenTimestamp itself.
setInterval(formatLastSeen, 1000);

restartPolling();
</script>

</body>
</html>
